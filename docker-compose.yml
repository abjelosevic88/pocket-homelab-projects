services:
  pocket-projects:
    image: ghcr.io/abjelosevic88/pocket-homelab-projects:latest
    container_name: pocket-projects
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-UTC}
      BASE_URL: ${BASE_URL:-}
      # Set both to skip the first-run setup screen and create the admin directly:
      # ADMIN_EMAIL: ${ADMIN_EMAIL}
      # ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # AUTH_MODE: proxy                # trust Remote-User from Authelia / Authentik / Tinyauth
      # NOTIFY_URL: http://apprise:8000/notify/projects   # assignments, mentions, due dates
      # CORE_URL: http://pocket-core:8080              # Pocket Core: sign-in, the other Pocket apps, Pocket AI, events
      # CORE_REGISTRATION_KEY: …
      # DEMO_DATA: "true"               # seed two demo teams with projects and issues into an empty box
    volumes:
      - ./data:/data                    # database, attachments, backups
